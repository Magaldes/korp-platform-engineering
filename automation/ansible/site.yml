---
- name: Provision Projeto Korp
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    project_root: "{{ playbook_dir | dirname | dirname }}"
    compose_file: "{{ project_root }}/infra/compose/compose.yaml"
    postgres_service: postgres
    migration_service: postgres-migrate
    redis_service: redis
    docker_ubuntu_codename: noble
    docker_network_name: korp-project-network
    required_docker_engine: "29.7.2"
    required_compose_version: "5.4.0"
    required_docker_package_pattern: "(^|:)29[.]7[.]2($|-)"
    required_compose_package_pattern: "(^|:)5[.]4[.]0($|-)"
    docker_keyring: /etc/apt/keyrings/docker.asc
    docker_repository: "deb [arch=amd64 signed-by={{ docker_keyring }}] https://download.docker.com/linux/ubuntu {{ docker_ubuntu_codename }} stable"

  tasks:
    # BEH-PROVISIONING / STEP-PORT80: this is intentionally the first
    # operational barrier. Everything before it is play parsing only.
    - name: "Preflight: inspect host TCP port 80 (read-only)"
      ansible.builtin.command:
        argv:
          - ss
          - -H
          - -ltnp
          - "sport = :80"
      register: port80_preflight
      changed_when: false
      failed_when: false

    - name: "Preflight: collect current Docker workloads for diagnostics (read-only)"
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --format
          - "{{ '{{.Names}} {{.Image}} {{.Ports}} {{.Status}}' }}"
      register: docker_workloads_preflight
      changed_when: false
      failed_when: false
      when: port80_preflight.rc == 0

    - name: "Preflight: identify the existing Korp NGINX listener (read-only)"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - ps
          - -q
          - nginx
      args:
        chdir: "{{ project_root }}"
      register: korp_nginx_preflight
      changed_when: false
      failed_when: false
      when: port80_preflight.rc == 0

    - name: "Preflight: fail when port 80 cannot be inspected"
      ansible.builtin.fail:
        msg: >-
          PORT 80 PREFLIGHT FAILED: cannot inspect host TCP port 80 with ss
          (rc={{ port80_preflight.rc }}; stderr={{ port80_preflight.stderr | default('') | trim }}).
          No package, Docker, network, Compose, or service mutation was attempted.
      when: port80_preflight.rc != 0

    - name: "Preflight: fail on occupied host TCP port 80 without mutation"
      ansible.builtin.fail:
        msg: >-
          PORT 80 CONFLICT: host TCP port 80 is already occupied.
          Listeners={{ port80_preflight.stdout | trim }}.
          Docker workloads={{ docker_workloads_preflight.stdout | default('unavailable') | trim }}.
          The existing service is preserved. No packages, Docker configuration,
          networks, Compose workloads, or existing services will be changed.
      when:
        - port80_preflight.stdout | trim | length > 0
        - korp_nginx_preflight.stdout | trim | length == 0

    # BEH-PROVISIONING / STEP-DOCKER: all tasks below are unreachable when
    # the non-destructive port-80 barrier fails.
    - name: "Docker: inspect installed Engine version (read-only)"
      ansible.builtin.command:
        argv:
          - docker
          - version
          - --format
          - "{{ '{{.Server.Version}}' }}"
      register: docker_engine_version_check
      changed_when: false
      failed_when: false

    - name: "Docker: inspect installed Compose plugin version (read-only)"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - version
          - --short
      register: docker_compose_version_check
      changed_when: false
      failed_when: false

    - name: "Docker: determine whether the approved runtime is already present"
      ansible.builtin.set_fact:
        docker_runtime_ready: >-
          {{ docker_engine_version_check.rc == 0 and
             docker_engine_version_check.stdout | trim == required_docker_engine and
             docker_compose_version_check.rc == 0 and
             docker_compose_version_check.stdout | trim == required_compose_version }}

    - name: "Docker: reject an installed Engine version requiring human decision"
      ansible.builtin.fail:
        msg: >-
          Docker Engine {{ docker_engine_version_check.stdout | default('unavailable') | trim }}
          is installed, but the approved version is {{ required_docker_engine }}.
          Silent upgrade or downgrade is forbidden; human decision is required.
      when:
        - docker_engine_version_check.rc == 0
        - docker_engine_version_check.stdout | trim != required_docker_engine

    - name: "Docker: reject an installed Compose version requiring human decision"
      ansible.builtin.fail:
        msg: >-
          Docker Compose plugin {{ docker_compose_version_check.stdout | default('unavailable') | trim }}
          is installed, but the approved version is {{ required_compose_version }}.
          Silent upgrade or downgrade is forbidden; human decision is required.
      when:
        - docker_compose_version_check.rc == 0
        - docker_compose_version_check.stdout | trim != required_compose_version

    - name: "Docker: install prerequisite packages from Ubuntu repositories"
      become: true
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
      when: not docker_runtime_ready

    - name: "Docker: create official repository keyring directory"
      become: true
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: not docker_runtime_ready

    - name: "Docker: install official repository signing key"
      become: true
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: "{{ docker_keyring }}"
        owner: root
        group: root
        mode: "0644"
      when: not docker_runtime_ready

    - name: "Docker: configure official Ubuntu 24.04 repository"
      become: true
      ansible.builtin.apt_repository:
        repo: "{{ docker_repository }}"
        filename: docker
        state: present
        update_cache: true
      when: not docker_runtime_ready

    - name: "Docker: resolve exact approved Engine package version"
      become: true
      ansible.builtin.shell: >-
        apt-cache madison docker-ce |
        awk -F'|' -v approved="{{ required_docker_engine }}"
        -v pattern="{{ required_docker_package_pattern }}"
        'function trim(value) { gsub(/^[[:space:]]+|[[:space:]]+$/, "", value); return value }
         { version=trim($2); if (version ~ pattern) { print version; exit } }'
      args:
        executable: /bin/bash
      register: docker_ce_package_query
      changed_when: false
      when: not docker_runtime_ready

    - name: "Docker: fail if official repository has no approved Engine package"
      ansible.builtin.fail:
        msg: >-
          Docker Engine {{ required_docker_engine }} is unavailable from the configured official
          Docker repository for Ubuntu 24.04 amd64.
          apt-cache result={{ docker_ce_package_query.stdout | default('') | trim }}.
          No incompatible Engine version will be selected.
      when:
        - not docker_runtime_ready
        - docker_ce_package_query.stdout | trim | length == 0

    - name: "Docker: resolve exact matching docker-ce-cli package version"
      become: true
      ansible.builtin.shell: >-
        apt-cache madison docker-ce-cli |
        awk -F'|' -v approved="{{ required_docker_engine }}"
        -v pattern="{{ required_docker_package_pattern }}"
        'function trim(value) { gsub(/^[[:space:]]+|[[:space:]]+$/, "", value); return value }
         { version=trim($2); if (version ~ pattern) { print version; exit } }'
      args:
        executable: /bin/bash
      register: docker_cli_package_query
      changed_when: false
      when: not docker_runtime_ready

    - name: "Docker: fail if matching docker-ce-cli package is unavailable"
      ansible.builtin.fail:
        msg: >-
          The matching docker-ce-cli package for Docker Engine {{ required_docker_engine }} is
          unavailable from the official repository; no incompatible version will be selected.
      when:
        - not docker_runtime_ready
        - docker_cli_package_query.stdout | trim | length == 0

    - name: "Docker: resolve Compose plugin package in the approved version"
      become: true
      ansible.builtin.shell: >-
        apt-cache madison docker-compose-plugin |
        awk -F'|' -v approved="{{ required_compose_version }}"
        -v pattern="{{ required_compose_package_pattern }}"
        'function trim(value) { gsub(/^[[:space:]]+|[[:space:]]+$/, "", value); return value }
         { version=trim($2); if (version ~ pattern) { print version; exit } }'
      args:
        executable: /bin/bash
      register: docker_compose_package_query
      changed_when: false
      when: not docker_runtime_ready

    - name: "Docker: fail if approved Compose 5.2.x package is unavailable"
      ansible.builtin.fail:
        msg: >-
          Docker Compose plugin {{ required_compose_version }} is unavailable from the configured
          official Docker repository; no incompatible plugin version will be selected.
      when:
        - not docker_runtime_ready
        - docker_compose_package_query.stdout | trim | length == 0

    - name: "Docker: install exact approved Engine and Compose versions"
      become: true
      ansible.builtin.apt:
        name:
          - "docker-ce={{ docker_ce_package_query.stdout | trim }}"
          - "docker-ce-cli={{ docker_cli_package_query.stdout | trim }}"
          - "docker-compose-plugin={{ docker_compose_package_query.stdout | trim }}"
          - containerd.io
          - docker-buildx-plugin
        state: present
      when: not docker_runtime_ready

    - name: "Docker: enable and start Docker Engine"
      become: true
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: "Docker: wait boundedly for the daemon"
      become: true
      ansible.builtin.command: docker info
      register: docker_info_ready
      changed_when: false
      retries: 15
      delay: 2
      until: docker_info_ready.rc == 0

    - name: "Docker: enforce approved Engine version"
      ansible.builtin.command:
        argv:
          - docker
          - version
          - --format
          - "{{ '{{.Server.Version}}' }}"
      register: docker_engine_version_final
      changed_when: false
      failed_when: docker_engine_version_final.stdout | trim != required_docker_engine

    - name: "Docker: enforce approved Compose plugin version"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - version
          - --short
      register: docker_compose_version_final
      changed_when: false
      failed_when: docker_compose_version_final.stdout | trim != required_compose_version

    # BEH-PROVISIONING / STEP-NET: Ansible owns the external bridge network.
    - name: "Network: inspect korp-project-network (read-only)"
      ansible.builtin.command:
        argv:
          - docker
          - network
          - inspect
          - --format
          - "{{ '{{.Driver}}' }}"
          - "{{ docker_network_name }}"
      register: korp_network_inspect
      changed_when: false
      failed_when: false

    - name: "Network: reject an existing non-bridge korp-project-network"
      ansible.builtin.fail:
        msg: >-
          Existing Docker network {{ docker_network_name }} has driver
          {{ korp_network_inspect.stdout | trim }}, but the approved driver is bridge.
          The existing network was not modified or recreated.
      when:
        - korp_network_inspect.rc == 0
        - korp_network_inspect.stdout | trim != 'bridge'

    - name: "Network: create korp-project-network as an external bridge"
      ansible.builtin.command:
        argv:
          - docker
          - network
          - create
          - --driver
          - bridge
          - "{{ docker_network_name }}"
      register: korp_network_create
      changed_when: true
      when: korp_network_inspect.rc != 0

    # BEH-PROVISIONING / STEP-BUILD and STEP-COMPOSE: the approved Compose
    # file remains the only deployment mechanism.
    - name: "Compose: validate the approved stack definition"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - config
      args:
        chdir: "{{ project_root }}"
      register: compose_config
      changed_when: false

    - name: "Compose: build the application image"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - build
          - http-server-projeto-korp
      args:
        chdir: "{{ project_root }}"
      register: compose_build
      changed_when: true

    - name: "Compose: start PostgreSQL before application services"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - up
          - -d
          - postgres
      args:
        chdir: "{{ project_root }}"
      register: postgres_up
      changed_when: true

    - name: "Compose: start Redis cache service"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - up
          - -d
          - "{{ redis_service }}"
      args:
        chdir: "{{ project_root }}"
      register: redis_up
      changed_when: true

    - name: "Redis: wait boundedly for cache readiness"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - exec
          - -T
          - "{{ redis_service }}"
          - redis-cli
          - ping
      args:
        chdir: "{{ project_root }}"
      register: redis_ready
      changed_when: false
      retries: 30
      delay: 2
      until: redis_ready.rc == 0 and redis_ready.stdout | trim == 'PONG'

    - name: "PostgreSQL: wait boundedly for database readiness"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - exec
          - -T
          - "{{ postgres_service }}"
          - pg_isready
          - -U
          - "{{ lookup('env', 'POSTGRES_USER') | default('korp', true) }}"
      args:
        chdir: "{{ project_root }}"
      register: postgres_ready
      changed_when: false
      retries: 30
      delay: 2
      until: postgres_ready.rc == 0

    - name: "PostgreSQL: run versioned migrations"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - run
          - --rm
          - "{{ migration_service }}"
      args:
        chdir: "{{ project_root }}"
      register: migration_run
      changed_when: true

    - name: "Compose: start application and observability services after migration"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - up
          - -d
          - --force-recreate
          - http-server-projeto-korp
          - prometheus
          - grafana
      args:
        chdir: "{{ project_root }}"
      register: compose_up
      changed_when: true

    - name: "Compose: inspect the recreated Go application container"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - ps
          - -q
          - http-server-projeto-korp
      args:
        chdir: "{{ project_root }}"
      register: application_container
      changed_when: false

    - name: "Compose: wait for the Go application container"
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{.State.Running}}' }}"
          - "{{ application_container.stdout | trim }}"
      register: application_running
      changed_when: false
      retries: 15
      delay: 2
      until:
        - application_container.stdout | trim | length > 0
        - application_running.rc == 0
        - application_running.stdout | trim == 'true'

    - name: "Compose: start NGINX after the Go application is registered"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - up
          - -d
          - --force-recreate
          - nginx
      args:
        chdir: "{{ project_root }}"
      register: nginx_up
      changed_when: true

    - name: "Validation: verify extended stack service status"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - ps
          - postgres
          - redis
          - http-server-projeto-korp
          - nginx
          - prometheus
          - grafana
      args:
        chdir: "{{ project_root }}"
      register: extended_stack_status
      changed_when: false

    - name: "NGINX/monitoring: show started stack components"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ compose_file }}"
          - ps
          - nginx
          - prometheus
          - grafana
          - http-server-projeto-korp
      args:
        chdir: "{{ project_root }}"
      register: stack_status
      changed_when: false

    # BEH-PROVISIONING / STEP-VERIFY and STEP-OUTPUT.
    - name: "Validation: wait boundedly for GET /projeto-korp through host port 80"
      ansible.builtin.uri:
        url: http://localhost:80/projeto-korp
        method: GET
        status_code: 200
        return_content: true
      register: http_validation
      retries: 30
      delay: 2
      until: http_validation.status == 200

    - name: "Validation: print returned JSON response"
      ansible.builtin.debug:
        msg: "GET http://localhost:80/projeto-korp returned HTTP {{ http_validation.status }}: {{ http_validation.content }}"
